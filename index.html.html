<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caderno do Treinador – Análise</title>
<style>
:root{--bg:#0f1720;--card:#18232f;--line:#2a3a4a;--txt:#e6edf3;--mut:#8aa0b4;--acc:#22c55e;--red:#ef4444;--blue:#3b82f6}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt)}
header{display:flex;gap:8px;align-items:center;padding:10px 16px;background:#0b1118;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:18px;margin:0 16px 0 0}
nav button,.btn{background:var(--card);color:var(--txt);border:1px solid var(--line);padding:7px 12px;border-radius:8px;cursor:pointer;font-size:14px}
nav button.on{background:var(--acc);color:#04130a;border-color:var(--acc);font-weight:600}
.btn.pri{background:var(--acc);color:#04130a;border-color:var(--acc);font-weight:600}
.btn.del{border-color:var(--red);color:var(--red)}
.sp{flex:1}
main{display:grid;grid-template-columns:280px 1fr;gap:16px;padding:16px;max-width:1400px;margin:auto}
@media(max-width:850px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.list .it{padding:9px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent;margin-bottom:4px}
.list .it:hover{background:#1f2d3b}.list .it.on{border-color:var(--acc);background:#1c2b22}
.list .it small{color:var(--mut);display:block}
input,select,textarea{width:100%;background:#0f1720;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;font-size:14px}
textarea{min-height:80px;resize:vertical}
label{font-size:12px;color:var(--mut);display:block;margin:10px 0 4px;text-transform:uppercase;letter-spacing:.04em}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:600px){.g2,.g3{grid-template-columns:1fr}}
h2{margin:0 0 6px;font-size:17px}h3{margin:18px 0 0;font-size:14px;color:var(--acc);border-bottom:1px solid var(--line);padding-bottom:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{border-bottom:1px solid var(--line);padding:5px;text-align:left}
td input{padding:5px}
.empty{color:var(--mut);text-align:center;padding:40px}
#board{width:100%;max-width:700px;background:#1f7a3a;border-radius:8px;touch-action:none;display:block}
.tool.on{outline:2px solid var(--acc)}
.tag{display:inline-block;font-size:11px;padding:2px 6px;border-radius:5px;background:#24384b;color:var(--mut);margin-left:4px}
@media print{header,.list,.noprint{display:none!important}main{display:block}body{background:#fff;color:#000}.card{border:none;background:#fff}input,select,textarea{border:none;color:#000;background:#fff}h3{color:#000}}
</style>
</head>
<body>
<header>
<h1>⚽ Caderno do Treinador</h1>
<nav><button id="tA" class="on" onclick="setTab('adv')">Análise de Adversário</button>
<button id="tB" onclick="setTab('bp')">Bolas Paradas</button></nav>
<span class="sp"></span>
<button class="btn" onclick="exportar()">💾 Backup</button>
<label class="btn" style="margin:0;text-transform:none;font-size:14px;color:var(--txt)">📂 Importar<input type="file" accept=".json" hidden onchange="importar(event)"></label>
<button class="btn" onclick="window.print()">🖨️ Imprimir/PDF</button>
</header>
<main>
<aside class="card list"><div class="row" style="margin-bottom:10px"><input id="q" placeholder="Pesquisar..." oninput="renderList()"><button class="btn pri" onclick="novo()">+ Novo</button></div><div id="lst"></div></aside>
<section class="card" id="det"></section>
</main>
<script>
const KEY='cadernoTreinador_v1';
let D=JSON.parse(localStorage.getItem(KEY)||'{"adv":[],"bp":[]}');
let tab='adv',sel=null;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const save=()=>localStorage.setItem(KEY,JSON.stringify(D));
const esc=s=>(s??'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SIS=['4-4-2','4-3-3','4-2-3-1','4-1-4-1','3-5-2','3-4-3','5-3-2','4-4-1-1','3-4-2-1','Outro'];
const TIPOS=['Canto ofensivo','Canto defensivo','Livre lateral ofensivo','Livre lateral defensivo','Livre frontal ofensivo','Livre frontal defensivo','Lançamento lateral','Penálti','Pontapé de saída','Pontapé de baliza'];

function setTab(t){tab=t;sel=null;tA.classList.toggle('on',t=='adv');tB.classList.toggle('on',t=='bp');renderList();renderDet()}
function renderList(){const q=(document.getElementById('q').value||'').toLowerCase();
 const arr=D[tab].filter(x=>JSON.stringify(x).toLowerCase().includes(q));
 lst.innerHTML=arr.length?arr.map(x=>tab=='adv'
  ?`<div class="it ${x.id==sel?'on':''}" onclick="abrir('${x.id}')"><b>${esc(x.nome||'Sem nome')}</b><small>${esc(x.data||'')} ${esc(x.sistema||'')}</small></div>`
  :`<div class="it ${x.id==sel?'on':''}" onclick="abrir('${x.id}')"><b>${esc(x.nome||'Sem nome')}</b><small>${esc(x.tipo)} ${x.advId?'· '+esc((D.adv.find(a=>a.id==x.advId)||{}).nome||''):''}</small></div>`).join('')
  :'<div class="empty">Nada ainda.<br>Carrega em "+ Novo".</div>'}
function novo(){let o;
 if(tab=='adv')o={id:uid(),nome:'',comp:'',data:'',local:'Casa',treinador:'',sistema:'4-4-2',sistDef:'',jogadores:[],ultimos:'',orgOf:'',orgDef:'',transOf:'',transDef:'',bpOf:'',bpDef:'',fortes:'',fracos:'',plano:'',notas:''};
 else o={id:uid(),nome:'',tipo:TIPOS[0],advId:'',lado:'Direito',marcador:'',sinal:'',descricao:'',zonas:'',chave:'',quadro:{tok:[],arr:[]}};
 D[tab].unshift(o);save();sel=o.id;renderList();renderDet()}
function abrir(id){sel=id;renderList();renderDet()}
function cur(){return D[tab].find(x=>x.id==sel)}
function upd(k,v){const o=cur();o[k]=v;save();if(['nome','data','sistema','tipo','advId'].includes(k))renderList()}
function apagar(){if(!confirm('Apagar este registo?'))return;D[tab]=D[tab].filter(x=>x.id!=sel);save();sel=null;renderList();renderDet()}
const F=(k,l,t='text')=>`<label>${l}</label><input type="${t}" value="${esc(cur()[k])}" oninput="upd('${k}',this.value)">`;
const T=(k,l,ph='')=>`<label>${l}</label><textarea placeholder="${ph}" oninput="upd('${k}',this.value)">${esc(cur()[k])}</textarea>`;
const S=(k,l,ops)=>`<label>${l}</label><select onchange="upd('${k}',this.value)">${ops.map(o=>{const v=Array.isArray(o)?o[0]:o,t=Array.isArray(o)?o[1]:o;return`<option value="${esc(v)}" ${cur()[k]==v?'selected':''}>${esc(t)}</option>`}).join('')}</select>`;

function renderDet(){const o=cur();
 if(!o){det.innerHTML='<div class="empty">Seleciona ou cria um registo à esquerda.</div>';return}
 if(tab=='adv'){
 det.innerHTML=`<div class="row"><h2>Relatório de Adversário</h2><span class="sp"></span><button class="btn del noprint" onclick="apagar()">Apagar</button></div>
 <div class="g3">${F('nome','Adversário')}${F('comp','Competição / Jornada')}${F('data','Data do jogo','date')}</div>
 <div class="g3">${S('local','Local',['Casa','Fora','Neutro'])}${F('treinador','Treinador adversário')}${S('sistema','Sistema base',SIS)}</div>
 ${F('sistDef','Sistema sem bola / variações')}
 ${T('ultimos','Últimos resultados / forma','Ex: V 2-1 vs X, E 0-0 vs Y...')}
 <h3>Jogadores-chave</h3>
 <table><tr><th style="width:60px">Nº</th><th>Nome</th><th style="width:110px">Posição</th><th>Características / Perigo</th><th class="noprint"></th></tr>
 ${o.jogadores.map((j,i)=>`<tr><td><input value="${esc(j.n)}" oninput="updJ(${i},'n',this.value)"></td><td><input value="${esc(j.nome)}" oninput="updJ(${i},'nome',this.value)"></td><td><input value="${esc(j.pos)}" oninput="updJ(${i},'pos',this.value)"></td><td><input value="${esc(j.obs)}" oninput="updJ(${i},'obs',this.value)"></td><td class="noprint"><button class="btn del" onclick="delJ(${i})">×</button></td></tr>`).join('')}
 </table><button class="btn noprint" style="margin-top:6px" onclick="addJ()">+ Jogador</button>
 <h3>Momentos do jogo</h3>
 <div class="g2">${T('orgOf','Organização ofensiva','Construção, saída de bola, como criam perigo, corredores preferidos...')}${T('orgDef','Organização defensiva','Altura do bloco, pressão, referências, espaços que deixam...')}</div>
 <div class="g2">${T('transOf','Transição ofensiva','Contra-ataque? Quem acelera? Primeiro passe...')}${T('transDef','Transição defensiva','Reação à perda, pressão imediata ou recuo...')}</div>
 <div class="g2">${T('bpOf','Bolas paradas ofensivas (resumo)','Marcadores, movimentos, alvos...')}${T('bpDef','Bolas paradas defensivas (resumo)','Zona/individual/misto, fragilidades...')}</div>
 <h3>Síntese</h3>
 <div class="g2">${T('fortes','Pontos fortes')}${T('fracos','Pontos fracos / onde explorar')}</div>
 ${T('plano','Plano de jogo / mensagens-chave para a equipa')}
 ${T('notas','Notas livres / links de vídeo')}
 <h3>Bolas paradas deste adversário</h3>
 <div>${D.bp.filter(b=>b.advId==o.id).map(b=>`<span class="tag" style="cursor:pointer" onclick="irBP('${b.id}')">${esc(b.nome||b.tipo)}</span>`).join('')||'<small style="color:var(--mut)">Nenhuma associada.</small>'}</div>`;
 } else {
 det.innerHTML=`<div class="row"><h2>Bola Parada</h2><span class="sp"></span><button class="btn noprint" onclick="duplicar()">Duplicar</button><button class="btn del noprint" onclick="apagar()">Apagar</button></div>
 <div class="g3">${F('nome','Nome / código da jogada')}${S('tipo','Tipo',TIPOS)}${S('advId','Adversário (ou nossa equipa)',[['','— Nossa equipa —'],...D.adv.map(a=>[a.id,a.nome||'Sem nome'])])}</div>
 <div class="g3">${S('lado','Lado',['Direito','Esquerdo','Central','Ambos'])}${F('marcador','Marcador / batedor')}${F('sinal','Sinal / código')}</div>
 <h3>Quadro tático</h3>
 <div class="row noprint" style="margin:8px 0">
  <button class="btn tool on" data-t="move" onclick="tool(this)">✋ Mover</button>
  <button class="btn tool" data-t="A" onclick="tool(this)">🔴 Nossa</button>
  <button class="btn tool" data-t="B" onclick="tool(this)">🔵 Adversário</button>
  <button class="btn tool" data-t="ball" onclick="tool(this)">⚪ Bola</button>
  <button class="btn tool" data-t="arr" onclick="tool(this)">➡ Seta (corrida)</button>
  <button class="btn tool" data-t="pass" onclick="tool(this)">⇢ Seta (passe)</button>
  <button class="btn tool" data-t="del" onclick="tool(this)">🗑 Apagar</button>
  <button class="btn" onclick="limpar()">Limpar</button>
 </div>
 <svg id="board" viewBox="0 0 680 525"></svg>
 <small style="color:var(--mut)" class="noprint">Meio-campo ofensivo (baliza em cima). Clica para adicionar; arrasta para mover/desenhar setas.</small>
 ${T('descricao','Descrição da jogada / movimentos','1º movimento..., bloqueio..., zona de ataque...')}
 <div class="g2">${T('zonas','Posicionamento / marcações','Quem fica em zona, quem marca quem, quem fica fora...')}${T('chave','Pontos-chave / como contrariar')}</div>`;
 drawBoard();}
}
function updJ(i,k,v){cur().jogadores[i][k]=v;save()}
function addJ(){cur().jogadores.push({n:'',nome:'',pos:'',obs:''});save();renderDet()}
function delJ(i){cur().jogadores.splice(i,1);save();renderDet()}
function irBP(id){setTab('bp');abrir(id)}
function duplicar(){const c=JSON.parse(JSON.stringify(cur()));c.id=uid();c.nome=(c.nome||'')+' (cópia)';D.bp.unshift(c);save();sel=c.id;renderList();renderDet()}

// ---- Quadro ----
let T_='move',drag=null,temp=null;
function tool(b){T_=b.dataset.t;document.querySelectorAll('.tool').forEach(x=>x.classList.toggle('on',x==b))}
function limpar(){if(confirm('Limpar quadro?')){cur().quadro={tok:[],arr:[]};save();drawBoard()}}
function pitch(){const L='stroke="#fff" stroke-width="2" fill="none" opacity=".85"';
 return `<rect x="20" y="15" width="640" height="495" ${L}/><rect x="138" y="15" width="404" height="165" ${L}/><rect x="248" y="15" width="184" height="55" ${L}/>
 <rect x="304" y="5" width="72" height="10" ${L}/><circle cx="340" cy="125" r="3" fill="#fff"/><path d="M 268 180 A 73 73 0 0 0 412 180" ${L}/>
 <path d="M 267 510 A 73 73 0 0 1 413 510" ${L}/><path d="M20 27 A12 12 0 0 0 32 15 M648 15 A12 12 0 0 0 660 27" ${L}/>
 <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#ffeb3b"/></marker>
 <marker id="ah2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#fff"/></marker></defs>`}
function drawBoard(){const b=document.getElementById('board');if(!b)return;const q=cur().quadro;
 let s=pitch();
 [...q.arr,...(temp?[temp]:[])].forEach((a,i)=>{s+=`<line data-a="${i}" x1="${a.x1}" y1="${a.y1}" x2="${a.x2}" y2="${a.y2}" stroke="${a.t=='pass'?'#fff':'#ffeb3b'}" stroke-width="3" ${a.t=='pass'?'stroke-dasharray="8 6"':''} marker-end="url(#${a.t=='pass'?'ah2':'ah'})"/>`});
 q.tok.forEach((t,i)=>{if(t.t=='ball')s+=`<circle data-k="${i}" cx="${t.x}" cy="${t.y}" r="8" fill="#fff" stroke="#000" stroke-width="2"/>`;
  else s+=`<g data-k="${i}"><circle cx="${t.x}" cy="${t.y}" r="14" fill="${t.t=='A'?'#ef4444':'#3b82f6'}" stroke="#fff" stroke-width="2"/><text x="${t.x}" y="${t.y+5}" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" pointer-events="none">${esc(t.n)}</text></g>`});
 b.innerHTML=s;}
function pt(e){const b=document.getElementById('board'),r=b.getBoundingClientRect();return{x:Math.round((e.clientX-r.left)*680/r.width),y:Math.round((e.clientY-r.top)*525/r.height)}}
document.addEventListener('pointerdown',e=>{const b=document.getElementById('board');if(!b||!b.contains(e.target))return;
 const q=cur().quadro,p=pt(e),g=e.target.closest('[data-k]'),ln=e.target.closest('[data-a]');
 if(T_=='del'){if(g)q.tok.splice(+g.dataset.k,1);else if(ln)q.arr.splice(+ln.dataset.a,1);save();drawBoard();return}
 if(T_=='move'){if(g)drag=+g.dataset.k;return}
 if(T_=='A'||T_=='B'){const n=prompt('Número / letra do jogador:',q.tok.filter(t=>t.t==T_).length+1);if(n===null)return;q.tok.push({t:T_,x:p.x,y:p.y,n});save();drawBoard();return}
 if(T_=='ball'){q.tok=q.tok.filter(t=>t.t!='ball');q.tok.push({t:'ball',x:p.x,y:p.y});save();drawBoard();return}
 if(T_=='arr'||T_=='pass'){temp={t:T_,x1:p.x,y1:p.y,x2:p.x,y2:p.y}}});
document.addEventListener('pointermove',e=>{if(drag===null&&!temp)return;const p=pt(e);
 if(drag!==null){const t=cur().quadro.tok[drag];t.x=p.x;t.y=p.y}else{temp.x2=p.x;temp.y2=p.y}drawBoard()});
document.addEventListener('pointerup',()=>{if(drag!==null){drag=null;save()}
 if(temp){if(Math.hypot(temp.x2-temp.x1,temp.y2-temp.y1)>10)cur().quadro.arr.push(temp);temp=null;save();drawBoard()}});

// ---- Backup ----
function exportar(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,1)],{type:'application/json'}));a.download='caderno-treinador-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function importar(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const n=JSON.parse(r.result);if(!n.adv||!n.bp)throw 0;if(confirm('Substituir os dados atuais pelo backup?')){D=n;save();sel=null;renderList();renderDet()}}catch{alert('Ficheiro inválido.')}};r.readAsText(f)}
renderList();renderDet();
</script>
</body>
</html>
