<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1118">
<title>Caderno do Treinador</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
<style>
:root{--bg:#0f1720;--card:#18232f;--line:#2a3a4a;--txt:#e6edf3;--mut:#8aa0b4;--acc:#22c55e;--red:#ef4444;--blue:#3b82f6;--yel:#facc15}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);-webkit-text-size-adjust:100%}
header{display:flex;gap:8px;align-items:center;padding:10px 14px;background:#0b1118;border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:9}
header h1{font-size:17px;margin:0 12px 0 0;white-space:nowrap}
nav button,.btn{background:var(--card);color:var(--txt);border:1px solid var(--line);padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:14px}
nav button.on{background:var(--acc);color:#04130a;border-color:var(--acc);font-weight:600}
.btn.pri{background:var(--acc);color:#04130a;border-color:var(--acc);font-weight:600}
.btn.del{border-color:var(--red);color:var(--red)}
.btn.sm{padding:4px 9px;font-size:13px}
.sp{flex:1}
main{display:grid;grid-template-columns:300px 1fr;gap:16px;padding:16px;max-width:1400px;margin:auto}
@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.list .it{padding:9px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent;margin-bottom:4px}
.list .it:hover{background:#1f2d3b}.list .it.on{border-color:var(--acc);background:#1c2b22}
.list .it small{color:var(--mut);display:block}
input,select,textarea{width:100%;background:#0f1720;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;font-size:14px}
textarea{min-height:80px;resize:vertical}
label{font-size:12px;color:var(--mut);display:block;margin:10px 0 4px;text-transform:uppercase;letter-spacing:.04em}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:650px){.g2,.g3{grid-template-columns:1fr}}
h2{margin:0 0 6px;font-size:17px}h3{margin:18px 0 0;font-size:14px;color:var(--acc);border-bottom:1px solid var(--line);padding-bottom:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
table{width:100%;border-collapse:collapse;font-size:13.5px}td,th{border-bottom:1px solid var(--line);padding:4px;text-align:left}
td input{padding:4px}th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase}
.empty{color:var(--mut);text-align:center;padding:40px}
#board{width:100%;max-width:700px;background:#1f7a3a;border-radius:8px;touch-action:none;display:block}
.tool.on{outline:2px solid var(--acc)}
.tag{display:inline-block;font-size:11.5px;padding:3px 7px;border-radius:6px;background:#24384b;color:var(--txt);margin:2px 4px 2px 0}
a.link{display:inline-block;background:#0f1720;border:1px solid var(--line);color:var(--txt);text-decoration:none;padding:8px 12px;border-radius:8px;font-size:14px;margin:2px 6px 2px 0}
a.link:hover{border-color:var(--acc);color:var(--acc)}
.warn{background:#2a1f10;border:1px solid #6b4b12;color:#f3d9a0;padding:9px 11px;border-radius:8px;font-size:13px;margin:10px 0}
small.hint{color:var(--mut);display:block;margin-top:4px}
.zn{font-size:11px;color:var(--mut);padding:2px 6px;border-radius:5px;background:#22303d;margin-left:6px}
.sav{font-size:12px;color:var(--acc);opacity:0;transition:opacity .3s}
.sav.on{opacity:1}
@media print{header,.list,.noprint,.sp{display:none!important}main{display:block;padding:0}body{background:#fff;color:#000}.card{border:none;background:#fff;padding:0}input,select,textarea{border:none;color:#000;background:#fff;padding:0}h3{color:#000}table{font-size:12px}td,th{border-bottom:1px solid #ccc}a.link{color:#000;border:none;padding:0}}
</style>
</head>
<body>
<header>
<h1>⚽ Caderno do Treinador</h1>
<nav>
<button id="tA" class="on" onclick="setTab('adv')">Adversário</button>
<button id="tB" onclick="setTab('bp')">Bolas Paradas</button>
<button id="tC" onclick="setTab('comp')">Competição</button>
</nav>
<span class="sp"></span>
<span class="sav" id="sav">guardado ✓</span>
<button class="btn sm" onclick="exportar()">💾 Backup</button>
<label class="btn sm" style="margin:0;text-transform:none;color:var(--txt)">📂 Importar<input type="file" accept=".json" hidden onchange="importar(event)"></label>
<button class="btn sm" onclick="window.print()">🖨️ PDF</button>
</header>
<main>
<aside class="card list" id="side">
  <div class="row" style="margin-bottom:10px"><input id="q" placeholder="Pesquisar..." oninput="renderList()"><button class="btn pri" onclick="novo()">+ Novo</button></div>
  <div id="lst"></div>
</aside>
<section class="card" id="det"></section>
</main>
<script>
/* ================= DADOS E ESTADO ================= */
const KEY='cadernoTreinador_v1';
const SEED={
 adv:[],bp:[],
 comp:{
  nome:'Campeonato Distrital 1.ª Divisão — AF Aveiro (Futebol Masculino)',
  epoca:'2026/27',fase:'1.ª Fase',
  links:[
   {n:'Classificação (FPF)',u:'https://resultados.fpf.pt/Competition/Details?competitionId=30077&seasonId=106'},
   {n:'Jogos / Jornadas (FPF)',u:'https://resultados.fpf.pt/Competition/Details?competitionId=30077&seasonId=106'},
   {n:'AF Aveiro no zerozero',u:'https://www.zerozero.pt/associacao/af-aveiro'}
  ],
  zona:'Norte',
  clasNorte:[
   ['1','Adc Sanguedo',5,4,1,0,12,4,13],['2','Gd Ronda',5,4,1,0,12,7,13],['3','Fc Macieirense',5,3,1,1,8,6,10],
   ['4','Sc Paivense',5,3,0,2,12,9,9],['5','Canedo Fc',5,3,0,2,10,8,9],['6','Acrd Mosteirô',5,3,0,2,8,8,9],
   ['7','Sc Esmoriz - Futebol Sdq',5,2,2,1,8,6,8],['8','Romariz Fc',5,2,2,1,10,9,8],['9','Ad Sanjoanense - Futebol Sad "B"',5,2,1,2,10,10,7],
   ['10','Real Cl. Nogueirense',5,1,1,3,6,9,4],['11','A. D. Nogueira Da Regedoura',5,1,0,4,5,11,3],['12','A.C. Cucujães',5,1,0,4,5,8,3],
   ['13','Ud Mansores',5,1,0,4,6,10,3],['14','Cd Arrifanense',5,0,1,4,5,12,1]
  ],
  clasSul:[
   ['1','Cr Antes',5,5,0,0,13,6,15],['2','Juveforce - Adc Ponte Vagos',5,4,1,0,16,2,13],['3','Ad Valecambrense',5,4,0,1,15,5,12],
   ['4','Aa Avanca',5,3,1,1,19,8,10],['5','Sc Alba',5,3,1,1,9,5,10],['6','Fc Pinheirense',5,3,1,1,8,7,10],
   ['7','Gd Gafanha',5,2,1,2,8,9,7],['8','Aa Macinhatense',5,2,0,3,8,8,6],['9','Ar Aguinense',5,2,0,3,4,9,6],
   ['10','Gd Calvão',5,1,1,3,4,5,4],['11','Cdc Macieira Cambra',5,1,0,4,4,14,3],['12','Ud Bustos',5,1,0,4,3,14,3],
   ['13','Sc Beira-Mar "B"',5,0,1,4,4,10,1],['14','Liga Amigos Aguada Cima',5,0,1,4,3,16,1]
  ],
  resultados:[
   ['Zona Sul','08/11','Aa Avanca','3 - 4','Cr Antes','Parque Desportivo Ass Atl Avanca'],
   ['Zona Sul','08/11','Ad Valecambrense','2 - 1','Gd Calvão','Campo Padre Baptista'],
   ['Zona Sul','08/11','Juveforce - Adc Ponte Vagos','5 - 0','Cdc Macieira Cambra','Campo Jose Maria Neto'],
   ['Zona Sul','08/11','Sc Alba','2 - 1','Liga Amigos Aguada Cima','']
  ],
  notas:'Classificação e resultados copiados do site da FPF em 17/11/2026 (5 jornadas). Atualizar à mão ou, mais tarde, automaticamente.'
 },
 jogos:[]
 }
};
let D=load();
let tab='adv',sel=null,editComp=false;

function load(){
 try{const r=localStorage.getItem(KEY);if(!r)return JSON.parse(JSON.stringify(SEED));
  const d=JSON.parse(r);const s=JSON.parse(JSON.stringify(SEED));
  d.adv=d.adv||[];d.bp=d.bp||[];d.jogos=d.jogos||[];
  if(!d.comp){d.comp=s.comp}else{d.comp.links=d.comp.links||s.comp.links;d.comp.clasNorte=d.comp.clasNorte||s.comp.clasNorte;d.comp.clasSul=d.comp.clasSul||s.comp.clasSul;d.comp.resultados=d.comp.resultados||[]}
  return d}
 catch{return JSON.parse(JSON.stringify(SEED))}
}
let tmr;
function save(){clearTimeout(tmr);tmr=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){alert('Não foi possível guardar. Use o botão Backup.')}},250);
 const el=document.getElementById('sav');if(el){el.classList.add('on');setTimeout(()=>el.classList.remove('on'),900)}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>(s??'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SIS=['4-4-2','4-3-3','4-2-3-1','4-1-4-1','3-5-2','3-4-3','5-3-2','4-4-1-1','3-4-2-1','Outro'];
const TIPOS=['Canto ofensivo','Canto defensivo','Livre lateral ofensivo','Livre lateral defensivo','Livre frontal ofensivo','Livre frontal defensivo','Lançamento lateral','Penálti','Pontapé de saída','Pontapé de baliza'];

/* ================= NAVEGAÇÃO ================= */
function setTab(t){tab=t;sel=null;
 ['adv','bp','comp'].forEach(k=>document.getElementById('t'+{adv:'A',bp:'B',comp:'C'}[k]).classList.toggle('on',k==t));
 document.getElementById('side').style.display=(t=='comp')?'none':'';
 document.querySelector('main').style.gridTemplateColumns=(t=='comp')?'1fr':'';
 renderList();renderDet();window.scrollTo(0,0)}
function cur(){return (D[tab]||[]).find(x=>x.id==sel)}

/* ================= LISTA ================= */
function renderList(){
 if(tab=='comp'){document.getElementById('lst').innerHTML='';return}
 const q=(document.getElementById('q').value||'').toLowerCase();
 const arr=D[tab].filter(x=>JSON.stringify(x).toLowerCase().includes(q));
 document.getElementById('lst').innerHTML=arr.length?arr.map(x=>tab=='adv'
  ?`<div class="it ${x.id==sel?'on':''}" onclick="abrir('${x.id}')"><b>${esc(x.nome||'Sem nome')}</b><small>${esc(x.data||'')} ${esc(x.sistema||'')}</small></div>`
  :`<div class="it ${x.id==sel?'on':''}" onclick="abrir('${x.id}')"><b>${esc(x.nome||'Sem nome')}</b><small>${esc(x.tipo)}${x.advId?' · '+esc((D.adv.find(a=>a.id==x.advId)||{}).nome||''):''}</small></div>`).join('')
  :'<div class="empty">Nada aqui ainda.<br>Carrega em "+ Novo".</div>'}
function abrir(id){sel=id;renderList();renderDet()}
function novo(){let o;
 if(tab=='adv')o={id:uid(),nome:'',comp:'',data:'',local:'Casa',treinador:'',sistema:'4-4-2',sistDef:'',jogadores:[],ultimos:'',orgOf:'',orgDef:'',transOf:'',transDef:'',bpOf:'',bpDef:'',fortes:'',fracos:'',plano:'',notas:''};
 else o={id:uid(),nome:'',tipo:TIPOS[0],advId:'',lado:'Direito',marcador:'',sinal:'',descricao:'',zonas:'',chave:'',quadro:{tok:[],arr:[]}};
 D[tab].unshift(o);save();sel=o.id;renderList();renderDet()}
function upd(k,v){const o=cur();o[k]=v;save();if(['nome','data','sistema','tipo','advId'].includes(k))renderList()}
function apagar(){if(!confirm('Apagar este registo?'))return;D[tab]=D[tab].filter(x=>x.id!=sel);save();sel=null;renderList();renderDet()}
const F=(k,l,t='text')=>`<label>${l}</label><input type="${t}" value="${esc(cur()[k])}" oninput="upd('${k}',this.value)">`;
const T=(k,l,ph='')=>`<label>${l}</label><textarea placeholder="${ph}" oninput="upd('${k}',this.value)">${esc(cur()[k])}</textarea>`;
const S=(k,l,ops)=>`<label>${l}</label><select onchange="upd('${k}',this.value)">${ops.map(o=>{const v=Array.isArray(o)?o[0]:o,t=Array.isArray(o)?o[1]:o;return`<option value="${esc(v)}" ${cur()[k]==v?'selected':''}>${esc(t)}</option>`}).join('')}</select>`;

/* ================= DETALHE ================= */
function renderDet(){const o=cur();
 if(tab=='comp'){renderComp();return}
 if(!o){det.innerHTML='<div class="empty">Seleciona ou cria um registo à esquerda.</div>';return}
 if(tab=='adv'){det.innerHTML=`<div class="row"><h2>Relatório de Adversário</h2><span class="sp"></span><button class="btn del noprint" onclick="apagar()">Apagar</button></div>
 <div class="g3">${F('nome','Adversário')}${F('comp','Competição / Jornada')}${F('data','Data do jogo','date')}</div>
 <div class="g3">${S('local','Local',['Casa','Fora','Neutro'])}${F('treinador','Treinador adversário')}${S('sistema','Sistema base',SIS)}</div>
 ${F('sistDef','Sistema sem bola / variações')}
 ${T('ultimos','Últimos resultados / forma','V 2-1 vs X · E 0-0 vs Y · D 1-3 vs Z')}
 <h3>Jogadores-chave</h3>
 <table><tr><th style="width:56px">Nº</th><th>Nome</th><th style="width:110px">Posição</th><th>Características / perigo</th><th class="noprint"></th></tr>
 ${o.jogadores.map((j,i)=>`<tr><td><input value="${esc(j.n)}" oninput="updJ(${i},'n',this.value)"></td><td><input value="${esc(j.nome)}" oninput="updJ(${i},'nome',this.value)"></td><td><input value="${esc(j.pos)}" oninput="updJ(${i},'pos',this.value)"></td><td><input value="${esc(j.obs)}" oninput="updJ(${i},'obs',this.value)"></td><td class="noprint"><button class="btn del sm" onclick="delJ(${i})">×</button></td></tr>`).join('')}
 </table><button class="btn sm noprint" style="margin-top:6px" onclick="addJ()">+ Jogador</button>
 <h3>Momentos do jogo</h3>
 <div class="g2">${T('orgOf','Organização ofensiva','Construção, saída de bola, corredores preferidos...')}${T('orgDef','Organização defensiva','Altura do bloco, pressão, referências, espaços que deixam...')}</div>
 <div class="g2">${T('transOf','Transição ofensiva','Contra-ataque, quem acelera, primeiro passe...')}${T('transDef','Transição defensiva','Reação à perda, pressão imediata ou recuo...')}</div>
 <div class="g2">${T('bpOf','Bolas paradas ofensivas (resumo)','Marcadores, movimentos, alvos...')}${T('bpDef','Bolas paradas defensivas (resumo)','Zona / individual / misto, fragilidades...')}</div>
 <h3>Síntese</h3>
 <div class="g2">${T('fortes','Pontos fortes')}${T('fracos','Pontos fracos / onde explorar')}</div>
 ${T('plano','Plano de jogo / mensagens-chave para a equipa')}
 ${T('notas','Notas livres / links de vídeo')}
 <h3>Bolas paradas deste adversário</h3>
 <div>${D.bp.filter(b=>b.advId==o.id).map(b=>`<span class="tag" style="cursor:pointer" onclick="irBP('${b.id}')">${esc(b.nome||b.tipo)}</span>`).join('')||'<small style="color:var(--mut)">Nenhuma associada.</small>'}</div>`;
 } else {det.innerHTML=`<div class="row"><h2>Bola Parada</h2><span class="sp"></span><button class="btn noprint" onclick="duplicar()">Duplicar</button><button class="btn del noprint" onclick="apagar()">Apagar</button></div>
 <div class="g3">${F('nome','Nome / código da jogada')}${S('tipo','Tipo',TIPOS)}${S('advId','Adversário (ou nossa equipa)',[['','— Nossa equipa —'],...D.adv.map(a=>[a.id,a.nome||'Sem nome'])])}</div>
 <div class="g3">${S('lado','Lado',['Direito','Esquerdo','Central','Ambos'])}${F('marcador','Marcador / batedor')}${F('sinal','Sinal / código')}</div>
 <h3>Quadro tático</h3>
 <div class="row noprint" style="margin:8px 0">
  <button class="btn tool on" data-t="move" onclick="tool(this)">✋ Mover</button>
  <button class="btn tool" data-t="A" onclick="tool(this)">🔴 Nossa</button>
  <button class="btn tool" data-t="B" onclick="tool(this)">🔵 Adversário</button>
  <button class="btn tool" data-t="ball" onclick="tool(this)">⚪ Bola</button>
  <button class="btn tool" data-t="arr" onclick="tool(this)">➡ Corrida</button>
  <button class="btn tool" data-t="pass" onclick="tool(this)">⇢ Passe</button>
  <button class="btn tool" data-t="del" onclick="tool(this)">🗑 Apagar</button>
  <button class="btn" onclick="limpar()">Limpar</button>
 </div>
 <svg id="board" viewBox="0 0 680 525"></svg>
 <small class="hint noprint">Meio-campo ofensivo (baliza em cima). Clica para colocar; arrasta para mover ou desenhar setas.</small>
 ${T('descricao','Descrição da jogada / movimentos','1º movimento, bloqueio, zona de ataque...')}
 <div class="g2">${T('zonas','Posicionamento / marcações','Quem fica em zona, quem marca quem, quem fica fora...')}${T('chave','Pontos-chave / como contrariar')}</div>`;
 drawBoard();}
}

/* ================= COMPETIÇÃO ================= */
function renderComp(){const c=D.comp;
 const cls=(rows,zona)=>`<h3>Classificação — ${zona}${editComp?' <button class="btn sm noprint" onclick="addRow(\'${zona}\')">+ Equipa</button>':''}</h3>
 <table><tr><th style="width:34px">#</th><th>Equipa</th><th style="width:34px">J</th><th style="width:34px">V</th><th style="width:34px">E</th><th style="width:34px">D</th><th style="width:34px">GM</th><th style="width:34px">GS</th><th style="width:40px">PTS</th><th class="noprint"></th></tr>
 ${rows.map((r,i)=>`<tr>${[0,1,2,3,4,5,6,7,8].map(k=>`<td>${editComp?`<input value="${esc(r[k])}" oninput="updCell(\'${zona}\',${i},${k},this.value)">`:esc(r[k])}</td>`).join('')}<td class="noprint">${editComp?`<button class="btn del sm" onclick="delRow(\'${zona}\',${i})">×</button>`:''}</td></tr>`).join('')}
 </table>`;
 det.innerHTML=`<div class="row"><h2>Competição</h2><span class="sp"></span>
  <button class="btn noprint" onclick="editComp?fecharEdit():abrirEdit()">${editComp?'✓ Concluir edição':'✏️ Editar'}</button></div>
 <div class="g3">${editComp?`<label>Nome</label><input value="${esc(c.nome)}" oninput="updComp('nome',this.value)">
  <label>Época</label><input value="${esc(c.epoca)}" oninput="updComp('epoca',this.value)">
  <label>Fase</label><input value="${esc(c.fase)}" oninput="updComp('fase',this.value)">`
  :`<div><small class="hint">Competição</small><b>${esc(c.nome)}</b></div><div><small class="hint">Época</small><b>${esc(c.epoca)}</b></div><div><small class="hint">Fase</small><b>${esc(c.fase)}</b></div>`}</div>
 <h3>Acesso rápido</h3>
 <div>${c.links.map(l=>`<a class="link" href="${esc(l.u)}" target="_blank" rel="noopener">🔗 ${esc(l.n)}</a>`).join('')}</div>
 ${editComp?`<div class="g2"><div><label>Link (nome)</label><input id="ln" placeholder="Ex.: Classificação Zona Sul"><label>Link (endereço)</label><input id="lu" placeholder="https://..."><button class="btn sm" style="margin-top:6px" onclick="addLink()">+ Adicionar link</button></div>
  <div><label>Remover link</label><select onchange="if(this.value)delLink(+this.value)"><option value="">— escolher —</option>${c.links.map((l,i)=>`<option value="${i}">${esc(l.n)}</option>`).join('')}</select></div></div>`:''}
 <div class="warn">Os dados abaixo foram copiados do site da FPF em <b>17/11/2026</b> (5 jornadas). Ficam desatualizados a cada jornada — carregue em <b>Editar</b> para os corrigir. O acesso rápido abre sempre o site oficial, que está sempre atual.</div>
 ${cls(c.clasNorte,'Norte')}
 ${cls(c.clasSul,'Sul')}
 <h3>Últimos resultados${editComp?' <button class="btn sm noprint" onclick="addRes()">+ Jogo</button>':''}</h3>
 <table><tr><th style="width:80px">Zona</th><th style="width:70px">Data</th><th>Casa</th><th style="width:70px">Res.</th><th>Fora</th><th>Campo</th><th class="noprint"></th></tr>
 ${c.resultados.map((r,i)=>`<tr>${[0,1,2,3,4,5].map(k=>`<td>${editComp?`<input value="${esc(r[k])}" oninput="updRes(${i},${k},this.value)">`:esc(r[k])}</td>`).join('')}<td class="noprint">${editComp?`<button class="btn del sm" onclick="delRes(${i})">×</button>`:''}</td></tr>`).join('')||'<tr><td colspan="7" style="color:var(--mut)">Sem resultados registados.</td></tr>'}
 </table>
 ${editComp?`<label>Notas</label><textarea oninput="updComp('notas',this.value)">${esc(c.notas)}</textarea>`
  :(c.notas?`<h3>Notas</h3><div>${esc(c.notas)}</div>`:'')}

 <h3>Fichas de jogo${editComp?' <button class="btn sm noprint" onclick="novoJogo()">+ Nova ficha</button>':''}</h3>
 ${D.jogos.length?`<table><tr><th style="width:70px">Data</th><th>Casa</th><th style="width:70px">Res.</th><th>Fora</th><th>Notas</th><th class="noprint"></th></tr>
  ${D.jogos.map(j=>`<tr><td>${esc(j.data)}</td><td>${esc(j.casa)}</td><td><b>${esc(j.res)}</b></td><td>${esc(j.fora)}</td><td>${esc(j.notas)}</td><td class="noprint"><button class="btn sm" onclick="abrirJogo('${j.id}')">Abrir</button></td></tr>`).join('')}
  </table>`:'<small style="color:var(--mut)">Nenhuma ficha ainda. Carregue em «+ Nova ficha» para registar jogadores e números.</small>'}`;
}
function updComp(k,v){D.comp[k]=v;save()}
function abrirEdit(){editComp=true;renderComp()}
function fecharEdit(){editComp=false;renderComp()}
function updCell(z,i,k,v){D.comp[z=='Norte'?'clasNorte':'clasSul'][i][k]=v;save()}
function addRow(z){D.comp[z=='Norte'?'clasNorte':'clasSul'].push([D.comp[z=='Norte'?'clasNorte':'clasSul'].length+1,'',0,0,0,0,0,0,0]);save();renderComp()}
function delRow(z,i){D.comp[z=='Norte'?'clasNorte':'clasSul'].splice(i,1);save();renderComp()}
function updRes(i,k,v){D.comp.resultados[i][k]=v;save()}
function addRes(){D.comp.resultados.unshift(['','','','-','','']);save();renderComp()}
function delRes(i){D.comp.resultados.splice(i,1);save();renderComp()}
function addLink(){const n=document.getElementById('ln').value.trim(),u=document.getElementById('lu').value.trim();if(!n||!u)return alert('Preenche o nome e o endereço.');D.comp.links.push({n,u});save();renderComp()}
function delLink(i){D.comp.links.splice(i,1);save();renderComp()}

/* ---- fichas de jogo ---- */
function novoJogo(){D.jogos.unshift({id:uid(),data:'',casa:'',fora:'',res:'',notas:'',comp:'',campo:'',
 equipaA:{nome:'',sistema:'',onze:''},equipaB:{nome:'',sistema:'',onze:''},
 marcadores:[],bp:[],minutos:''});save();abrirJogo(D.jogos[0].id)}
function abrirJogo(id){const j=D.jogos.find(x=>x.id==id);
 det.innerHTML=`<div class="row"><button class="btn noprint" onclick="renderComp()">← Voltar</button><h2 style="margin:0">Ficha de Jogo</h2><span class="sp"></span><button class="btn del noprint" onclick="delJogo('${id}')">Apagar</button></div>
 <div class="g3"><label>Data</label><input type="date" value="${esc(j.data)}" oninput="updJogo('${id}','data',this.value)">
  <label>Campo</label><input value="${esc(j.campo)}" oninput="updJogo('${id}','campo',this.value)">
  <label>Competição</label><input value="${esc(j.comp)}" oninput="updJogo('${id}','comp',this.value)"></div>
 <div class="g3"><label>Casa</label><input value="${esc(j.casa)}" oninput="updJogo('${id}','casa',this.value)">
  <label>Resultado</label><input placeholder="2 - 1" value="${esc(j.res)}" oninput="updJogo('${id}','res',this.value)">
  <label>Fora</label><input value="${esc(j.fora)}" oninput="updJogo('${id}','fora',this.value)"></div>
 ${lado('A','Nossa equipa',j.equipaA,id)}
 ${lado('B','Adversário',j.equipaB,id)}
 <h3>Marcadores</h3><div><small class="hint">Minuto · equipa · marcador. Marque quem marcou de bola parada — dá para ver onde os golos nascem.</small></div>
 <div class="g3"><input placeholder="Minuto (ex.: 34')" oninput="updJogo('${id}','minAnota',this.value)"><input placeholder="Marcador" id="mkN"><select id="mkT"><option>Casa</option><option>Fora</option></select></div>
 <button class="btn sm noprint" onclick="addMarc('${id}')">+ Marcador</button>
 <table style="margin-top:8px"><tr><th style="width:60px">Min.</th><th>Marcador</th><th style="width:90px">Equipa</th><th style="width:150px">Bola parada</th><th class="noprint"></th></tr>
 ${j.marcadores.map((m,i)=>`<tr>${[0,1,2,3].map(k=>`<td>${esc(m[k])}</td>`).join('')}<td class="noprint"><button class="btn del sm" onclick="delMarc('${id}',${i})">×</button></td></tr>`).join('')||'<tr><td colspan="5" style="color:var(--mut)">Sem golos registados.</td></tr>'}
 </table>
 <h3>Bolas paradas do jogo</h3>
 <div class="g2"><input placeholder="Tipo (ex.: canto ofensivo)" id="bpT"><input placeholder="Resultado (golo, remate, perdida)" id="bpR"></div>
 <button class="btn sm noprint" style="margin-top:6px" onclick="addBP('${id}')">+ Bola parada</button>
 <table style="margin-top:8px"><tr><th style="width:220px">Tipo</th><th>Resultado</th><th class="noprint"></th></tr>
 ${j.bp.map((b,i)=>`<tr><td>${esc(b[0])}</td><td>${esc(b[1])}</td><td class="noprint"><button class="btn del sm" onclick="delBP('${id}',${i})">×</button></td></tr>`).join('')||'<tr><td colspan="3" style="color:var(--mut)">Sem bolas paradas registadas.</td></tr>'}
 </table>
 <h3>Empréstimos — jogadores que entraram</h3>
 <div><small class="hint">Para jogadores novos (empréstimos, juniores, convocados de última hora). Fica registado quem são e os números.</small></div>
 <div class="g3"><input placeholder="Nº" id="empN"><input placeholder="Nome" id="empNome"><input placeholder="Posição / nota" id="empPos"></div>
 <button class="btn sm noprint" style="margin-top:6px" onclick="addEmp('${id}')">+ Empréstimo</button>
 <table style="margin-top:8px"><tr><th style="width:60px">Nº</th><th>Nome</th><th>Posição / nota</th><th class="noprint"></th></tr>
 ${(j.emp||[]).map((e,i)=>`<tr><td>${esc(e[0])}</td><td>${esc(e[1])}</td><td>${esc(e[2])}</td><td class="noprint"><button class="btn del sm" onclick="delEmp('${id}',${i})">×</button></td></tr>`).join('')||'<tr><td colspan="4" style="color:var(--mut)">Sem empréstimos registados.</td></tr>'}
 </table>
 <h3>Notas do jogo</h3><textarea oninput="updJogo('${id}','notas',this.value)">${esc(j.notas)}</textarea>`;
}
function lado(which,tit,e,id){return `<h3>${tit}</h3>
 <div class="g2"><label>Nome da equipa</label><input value="${esc(e.nome)}" oninput="updLado('${id}','${which}','nome',this.value)">
 <label>Sistema / disposição</label><input placeholder="4-4-2" value="${esc(e.sistema)}" oninput="updLado('${id}','${which}','sistema',this.value)"></div>
 <label>Jogadores — nº e nome (um por linha: 12 João Silva)</label>
 <textarea placeholder="1 Rui&#10;4 Pedro&#10;7 Ana&#10;..." oninput="updLado('${id}','${which}','onze',this.value)">${esc(e.onze)}</textarea>
 <div class="row noprint" style="margin-top:6px"><button class="btn sm" onclick="verGrelha('${id}','${which}')">Ver grelha lado a lado</button></div>
 <div id="gr_${id}_${which}"></div>`}
function updLado(id,w,k,v){const j=D.jogos.find(x=>x.id==id);j[w=='A'?'equipaA':'equipaB'][k]=v;save()}
function verGrelha(id,w){const j=D.jogos.find(x=>x.id==id),e=j[w=='A'?'equipaA':'equipaB'];
 const L=s=>(s||'').split('\n').map(x=>x.trim()).filter(Boolean);
 const a=L(e.onze),b=L(w=='A'?j.equipaB.onze:j.equipaA.onze),n=Math.max(a.length,b.length);
 document.getElementById('gr_'+id+'_'+w).innerHTML=`<table style="margin-top:8px"><tr><th>${esc(e.nome||'Nossa equipa')}</th><th>${esc((w=='A'?j.equipaB:j.equipaA).nome||'Outra equipa')}</th></tr>
 ${Array.from({length:n},(_,i)=>`<tr><td>${esc(a[i]||'')}</td><td>${esc(b[i]||'')}</td></tr>`).join('')}</table>`}
function updJogo(id,k,v){const j=D.jogos.find(x=>x.id==id);j[k]=v;save()}
function delJogo(id){if(!confirm('Apagar esta ficha de jogo?'))return;D.jogos=D.jogos.filter(x=>x.id!=id);save();renderComp()}
function addMarc(id){const j=D.jogos.find(x=>x.id==id),n=document.getElementById('mkN').value.trim(),t=document.getElementById('mkT').value;
 if(!n)return;const bp=document.getElementById('mkBP')?document.getElementById('mkBP').value:'';
 j.marcadores.push([j.minAnota||'',n,t,j.minAnota?'':'' ]);j.marcadores[j.marcadores.length-1][3]=prompt('Golo de bola parada? (canto, livre, penálti, ou deixar vazio)')||'';
 document.getElementById('mkN').value='';save();abrirJogo(id)}
function delMarc(id,i){const j=D.jogos.find(x=>x.id==id);j.marcadores.splice(i,1);save();abrirJogo(id)}
function addBP(id){const j=D.jogos.find(x=>x.id==id),t=document.getElementById('bpT').value.trim(),r=document.getElementById('bpR').value.trim();
 if(!t)return;j.bp.push([t,r]);document.getElementById('bpT').value='';document.getElementById('bpR').value='';save();abrirJogo(id)}
function delBP(id,i){const j=D.jogos.find(x=>x.id==id);j.bp.splice(i,1);save();abrirJogo(id)}
function addEmp(id){const j=D.jogos.find(x=>x.id==id);j.emp=j.emp||[];
 const n=document.getElementById('empN').value.trim(),nm=document.getElementById('empNome').value.trim(),p=document.getElementById('empPos').value.trim();
 if(!nm)return alert('Escreve o nome do jogador.');j.emp.push([n,nm,p]);save();abrirJogo(id)}
function delEmp(id,i){const j=D.jogos.find(x=>x.id==id);j.emp.splice(i,1);save();abrirJogo(id)}

/* ---- adversário: jogadores ---- */
function updJ(i,k,v){cur().jogadores[i][k]=v;save()}
function addJ(){cur().jogadores.push({n:'',nome:'',pos:'',obs:''});save();renderDet()}
function delJ(i){cur().jogadores.splice(i,1);save();renderDet()}
function irBP(id){setTab('bp');abrir(id)}
function duplicar(){const c=JSON.parse(JSON.stringify(cur()));c.id=uid();c.nome=(c.nome||'')+' (cópia)';D.bp.unshift(c);save();sel=c.id;renderList();renderDet()}

/* ================= QUADRO TÁTICO ================= */
let T_='move',drag=null,temp=null;
function tool(b){T_=b.dataset.t;document.querySelectorAll('.tool').forEach(x=>x.classList.toggle('on',x==b))}
function limpar(){if(confirm('Limpar o quadro?')){cur().quadro={tok:[],arr:[]};save();drawBoard()}}
function pitch(){const L='stroke="#fff" stroke-width="2" fill="none" opacity=".85"';
 return `<rect x="20" y="15" width="640" height="495" ${L}/><rect x="138" y="15" width="404" height="165" ${L}/><rect x="248" y="15" width="184" height="55" ${L}/>
 <rect x="304" y="5" width="72" height="10" ${L}/><circle cx="340" cy="125" r="3" fill="#fff"/><path d="M 268 180 A 73 73 0 0 0 412 180" ${L}/>
 <path d="M 267 510 A 73 73 0 0 1 413 510" ${L}/><path d="M20 27 A12 12 0 0 0 32 15 M648 15 A12 12 0 0 0 660 27" ${L}/>
 <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#facc15"/></marker>
 <marker id="ah2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#fff"/></marker></defs>`}
function drawBoard(){const b=document.getElementById('board');if(!b)return;const q=cur().quadro;
 let s=pitch();
 [...q.arr,...(temp?[temp]:[])].forEach((a,i)=>{s+=`<line data-a="${i}" x1="${a.x1}" y1="${a.y1}" x2="${a.x2}" y2="${a.y2}" stroke="${a.t=='pass'?'#fff':'#facc15'}" stroke-width="3" ${a.t=='pass'?'stroke-dasharray="8 6"':''} marker-end="url(#${a.t=='pass'?'ah2':'ah'})"/>`});
 q.tok.forEach((t,i)=>{if(t.t=='ball')s+=`<circle data-k="${i}" cx="${t.x}" cy="${t.y}" r="8" fill="#fff" stroke="#000" stroke-width="2"/>`;
  else s+=`<g data-k="${i}"><circle cx="${t.x}" cy="${t.y}" r="14" fill="${t.t=='A'?'#ef4444':'#3b82f6'}" stroke="#fff" stroke-width="2"/><text x="${t.x}" y="${t.y+5}" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" pointer-events="none">${esc(t.n)}</text></g>`});
 b.innerHTML=s}
function pt(e){const b=document.getElementById('board'),r=b.getBoundingClientRect();return{x:Math.round((e.clientX-r.left)*680/r.width),y:Math.round((e.clientY-r.top)*525/r.height)}}
document.addEventListener('pointerdown',e=>{const b=document.getElementById('board');if(!b||!b.contains(e.target)||tab!='bp')return;
 const q=cur().quadro,p=pt(e),g=e.target.closest('[data-k]'),ln=e.target.closest('[data-a]');
 if(T_=='del'){if(g)q.tok.splice(+g.dataset.k,1);else if(ln)q.arr.splice(+ln.dataset.a,1);save();drawBoard();return}
 if(T_=='move'){if(g)drag=+g.dataset.k;return}
 if(T_=='A'||T_=='B'){const n=prompt('Número ou letra do jogador:',q.tok.filter(t=>t.t==T_).length+1);if(n===null)return;q.tok.push({t:T_,x:p.x,y:p.y,n});save();drawBoard();return}
 if(T_=='ball'){q.tok=q.tok.filter(t=>t.t!='ball');q.tok.push({t:'ball',x:p.x,y:p.y});save();drawBoard();return}
 if(T_=='arr'||T_=='pass'){temp={t:T_,x1:p.x,y1:p.y,x2:p.x,y2:p.y}}});
document.addEventListener('pointermove',e=>{if((drag===null&&!temp)||tab!='bp')return;const p=pt(e);
 if(drag!==null){const t=cur().quadro.tok[drag];t.x=p.x;t.y=p.y}else{temp.x2=p.x;temp.y2=p.y}drawBoard()});
document.addEventListener('pointerup',()=>{if(drag!==null){drag=null;save()}
 if(temp){if(Math.hypot(temp.x2-temp.x1,temp.y2-temp.y1)>10)cur().quadro.arr.push(temp);temp=null;save();drawBoard()}});

/* ================= BACKUP ================= */
function exportar(){const a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,1)],{type:'application/json'}));
 a.download='caderno-treinador-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function importar(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const n=JSON.parse(r.result);if(!n.adv||!n.bp)throw 0;
  if(confirm('Substituir os dados atuais pelo backup?')){D=n;D.jogos=D.jogos||[];if(!D.comp)D.comp=SEED.comp;localStorage.setItem(KEY,JSON.stringify(D));sel=null;setTab(tab)}}catch{alert('Ficheiro inválido.')}};
 r.readAsText(f)}

renderList();renderDet();
</script>
</body>
</html>
