<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1118">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Análise de Adversário</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
<style>
:root{--bg:#0d141b;--card:#16212c;--card2:#1c2937;--line:#2b3b4b;--txt:#e8eef4;--mut:#8ba1b5;--acc:#2fbf71;--red:#e23b3b;--blue:#3b82f6;--yel:#ffe14d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
header{position:sticky;top:0;z-index:20;background:#0a1117;border-bottom:1px solid var(--line);padding:9px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
header .tit{font-weight:700;font-size:16px;margin-right:6px}
header .sp{flex:1}
button,.btn{font:inherit;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:8px 12px;cursor:pointer}
button:active{transform:scale(.98)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#04140b;font-weight:700}
.btn.del{border-color:#7a2a2a;color:#ff8f8f}
.btn.sm{padding:5px 9px;font-size:13px}
.wrap{max-width:1150px;margin:0 auto;padding:12px 12px 90px}
@media(min-width:820px){.wrap{display:grid;grid-template-columns:250px 1fr;gap:14px;align-items:start}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:12px}
.side{position:relative}
.side .it{padding:9px 10px;border-radius:9px;cursor:pointer;border:1px solid transparent;margin-bottom:5px;background:var(--card2)}
.side .it.on{border-color:var(--acc);background:#17301f}
.side .it b{display:block;font-size:14px}
.side .it small{color:var(--mut);font-size:12px}
h2{margin:0 0 4px;font-size:18px}
h3{margin:0;font-size:14px;letter-spacing:.03em;text-transform:uppercase;color:var(--acc)}
.sec{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
label{display:block;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin:10px 0 4px}
input,textarea,select{width:100%;font:inherit;font-size:15px;background:#0f1a24;color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:9px}
textarea{min-height:76px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:620px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}}
.row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.sp2{flex:1}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:5px 4px;border-bottom:1px solid var(--line)}
th{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
td input,td select{padding:6px}
.tags{display:flex;gap:5px}
.fV,.fE,.fD{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;border-radius:6px;font-size:12px;font-weight:800;color:#03120a}
.fV{background:#2fbf71}.fE{background:#9aa8b4;color:#101a22}.fD{background:#e23b3b;color:#fff}
.jogada{border:1px solid var(--line);border-radius:12px;padding:11px;background:var(--card2);margin-bottom:10px}
.jogada .cab{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.jogada .cab b{font-size:14px}
.palco{position:relative;width:100%;max-width:430px;margin:0 auto}
.campo{width:100%;display:block;border-radius:10px;background:
 repeating-linear-gradient(0deg,#1e7a3d 0 8.33%,#1a6d36 8.33% 16.66%);touch-action:none;user-select:none}
@media print{header,.side,.noprint{display:none!important}body{background:#fff;color:#000}.wrap{display:block;padding:0}.card{border:none;padding:0;background:#fff;margin:0 0 10px}h3{color:#000}th,td{border-bottom:1px solid #bbb}input,textarea,select{border:none;background:#fff;color:#000;padding:0}.jogada{background:#fff;border:1px solid #ccc}.campo{background:#1e7a3d}}
.hint{font-size:12px;color:var(--mut);margin-top:6px}
.empty{color:var(--mut);text-align:center;padding:34px 10px}
.aviso{background:#241f10;border:1px solid #6a5518;color:#f0dc9e;border-radius:9px;padding:8px 10px;font-size:12.5px;margin-top:8px}
.sav{font-size:12px;color:var(--acc);opacity:0;transition:opacity .25s}
.sav.on{opacity:1}
#fab{position:fixed;right:14px;bottom:14px;z-index:30;display:none}
@media(max-width:819px){#fab{display:block}}
</style>
</head>
<body>
<header>
 <span class="tit">📋 Análise de Adversário</span>
 <span class="sav" id="sav">guardado ✓</span>
 <span class="sp"></span>
 <button class="btn sm" id="bExp" type="button">💾 Backup</button>
 <label class="btn sm" style="margin:0;text-transform:none;font-size:13px;padding:8px 12px">📂 Importar<input type="file" id="fImp" accept=".json" hidden></label>
 <button class="btn sm" id="bPrn" type="button">🖨️ PDF</button>
</header>

<div class="wrap">
 <aside class="side card">
  <div class="row" style="margin-bottom:10px">
   <input id="q" placeholder="Pesquisar adversário...">
   <button class="btn pri" id="bNovo" type="button">+ Novo</button>
  </div>
  <div id="lst"></div>
 </aside>
 <main id="det"></main>
</div>
<button class="btn pri" id="fab" type="button">+ Novo adversário</button>

<script>
/* ================================================================
   ANÁLISE DE ADVERSÁRIO — aplicação de um treinador
   Peça 1: motor do quadro tático
   Peça 2: guardar/carregar no aparelho (localStorage)  -> TESTADO
   Peça 3: ecrãs e ligações                            -> TESTADO
   ================================================================ */

/* ---------- PEÇA 1: QUADRO TÁTICO ---------- */
function campo(){
 return '<svg viewBox="0 0 680 1050" class="campo" preserveAspectRatio="xMidYMid meet">'
 +'<defs>'
 +'<marker id="seta" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#ffe14d"/></marker>'
 +'<marker id="setaP" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#ffffff"/></marker>'
 +'</defs>'
 +'<rect x="10" y="10" width="660" height="1030" fill="none" stroke="#fff" stroke-width="3" opacity=".9"/>'
 +'<line x1="10" y1="525" x2="670" y2="525" stroke="#fff" stroke-width="3" opacity=".9"/>'
 +'<circle cx="340" cy="525" r="80" fill="none" stroke="#fff" stroke-width="3" opacity=".9"/>'
 +'<circle cx="340" cy="525" r="4" fill="#fff"/>'
 +'<rect x="170" y="10" width="340" height="155" fill="none" stroke="#fff" stroke-width="3" opacity=".9"/>'
 +'<rect x="250" y="10" width="180" height="60" fill="none" stroke="#fff" stroke-width="3" opacity=".9"/>'
 +'<path d="M275,165 a65,65 0 0 0 130,0" fill="none" stroke="#fff" stroke-width="3" opacity=".9"/>'
 +'<rect x="170" y="885" width="340" height="155" fill="none" stroke="#fff" stroke-width="3" opacity=".9"/>'
 +'<rect x="250" y="980" width="180" height="60" fill="none" stroke="#fff" stroke-width="3" opacity=".9"/>'
 +'<path d="M275,885 a65,65 0 0 1 130,0" fill="none" stroke="#fff" stroke-width="3" opacity=".9"/>'
 +'</svg>';
}
function desenhar(c){
 var q=(c&&c.q)?c.q:{tok:[],arr:[]};
 if(!Array.isArray(q.tok))q.tok=[];
 if(!Array.isArray(q.arr))q.arr=[];
 var s=campo();
 q.arr.forEach(function(a,i){
  s+='<line data-a="'+i+'" x1="'+a.x1+'" y1="'+a.y1+'" x2="'+a.x2+'" y2="'+a.y2+'" stroke="'+(a.t==='pass'?'#ffffff':'#ffe14d')+'" stroke-width="3.5" '+(a.t==='pass'?'stroke-dasharray="9 7"':'')+' marker-end="url(#'+(a.t==='pass'?'setaP':'seta')+')"/>';
 });
 q.tok.forEach(function(t,i){
  if(t.t==='ball'){
   s+='<g data-k="'+i+'"><circle cx="'+t.x+'" cy="'+t.y+'" r="11" fill="#fff" stroke="#111" stroke-width="2"/><text x="'+t.x+'" y="'+t.y+'" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#111">&#9917;</text></g>';
  } else if(t.t==='cone'){
   s+='<g data-k="'+i+'"><polygon points="'+t.x+','+(t.y-13)+' '+(t.x-11)+','+(t.y+10)+' '+(t.x+11)+','+(t.y+10)+'" fill="#ffe14d" stroke="#111" stroke-width="1.5"/></g>';
  } else {
   var cor=t.t==='A'?'#e23b3b':'#3b82f6';
   s+='<g data-k="'+i+'"><circle cx="'+t.x+'" cy="'+t.y+'" r="19" fill="'+cor+'" stroke="#fff" stroke-width="2.5"/><text x="'+t.x+'" y="'+t.y+'" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="#fff" pointer-events="none">'+String(t.n==null?'':t.n)+'</text></g>';
  }
 });
 return s;
}
function pontos(e,el){
 var r=el.getBoundingClientRect();
 return {x:Math.round((e.clientX-r.left)*680/r.width), y:Math.round((e.clientY-r.top)*1050/r.height)};
}

/* ---------- PEÇA 2: GUARDAR NO APARELHO ---------- */
var CHAVE='analiseAdversario_v2';
function novoAdversario(nome){
 return {id:'a'+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36),
  nome:nome||'', equipa:'', data:'', comp:'', campo:'', sistema:'', sistemaNota:'',
  forma:[], onze:[],
  orgOf:'', orgDef:'', trOf:'', trDef:'',
  bpOf:[novaJogada('Canto ofensivo'),novaJogada('Livre lateral ofensivo'),novaJogada('Livre frontal ofensivo')],
  bpDef:[novaJogada('Canto defensivo'),novaJogada('Livre frontal defensivo')],
  pontosChave:'', suspensos:'', notas:'', links:[]};
}
function novaJogada(tipo){return {id:'j'+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36),tipo:tipo,nome:'',descricao:'',q:{tok:[],arr:[]}}}
function carregar(){
 try{ var r=localStorage.getItem(CHAVE); if(!r)return {adv:[],sel:null};
  var d=JSON.parse(r);
  if(!d||!Array.isArray(d.adv))return {adv:[],sel:null};
  d.adv.forEach(function(a){
   if(!Array.isArray(a.forma))a.forma=[];
   if(!Array.isArray(a.onze))a.onze=[];
   if(!Array.isArray(a.bpOf)||!a.bpOf.length)a.bpOf=[novaJogada('Canto ofensivo'),novaJogada('Livre lateral ofensivo'),novaJogada('Livre frontal ofensivo')];
   if(!Array.isArray(a.bpDef)||!a.bpDef.length)a.bpDef=[novaJogada('Canto defensivo'),novaJogada('Livre frontal defensivo')];
   if(!Array.isArray(a.links))a.links=[];
   a.bpOf.forEach(function(j){if(!j.q)j.q={tok:[],arr:[]}});
   a.bpDef.forEach(function(j){if(!j.q)j.q={tok:[],arr:[]}});
  });
  return d;
 }catch(e){return {adv:[],sel:null}}
}
var E=carregar();
var tmr=null;
function gravar(){
 if(tmr)clearTimeout(tmr);
 tmr=setTimeout(function(){
  try{ localStorage.setItem(CHAVE,JSON.stringify(E));
   var s=document.getElementById('sav'); if(s){s.className='sav on';setTimeout(function(){s.className='sav'},800);}
  }catch(err){ alert('Não consegui guardar neste aparelho. Use o botão Backup para não perder o trabalho.'); }
 },200);
}
function atual(){ return E.adv.filter(function(a){return a.id===E.sel})[0]||null; }
function limpo(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]}); }
function escAttr(s){ return limpo(s); }

/* ---------- PEÇA 3: ECRÃS ---------- */
var TIPOS_OF=['Canto ofensivo','Livre lateral ofensivo','Livre frontal ofensivo','Lançamento lateral ofensivo','Pontapé de saída','Penálti'];
var TIPOS_DEF=['Canto defensivo','Livre lateral defensivo','Livre frontal defensivo','Penálti (defesa)','Pontapé de baliza'];
var OPCOES_TIPO=TIPOS_OF.concat(TIPOS_DEF);

function lista(){
 var q=(document.getElementById('q').value||'').toLowerCase();
 var arr=E.adv.filter(function(a){return JSON.stringify(a).toLowerCase().indexOf(q)>=0});
 var h='';
 if(!arr.length){ h='<div class="empty">Ainda não há adversários.<br>Carregue em «+ Novo».</div>'; }
 else arr.forEach(function(a){
  h+='<div class="it'+(a.id===E.sel?' on':'')+'" data-id="'+a.id+'"><b>'+limpo(a.nome||'Sem nome')+'</b><small>'+limpo(a.data||'sem data')+(a.sistema?' · '+limpo(a.sistema):'')+'</small></div>';
 });
 document.getElementById('lst').innerHTML=h;
 Array.prototype.forEach.call(document.querySelectorAll('#lst .it'),function(el){
  el.onclick=function(){ E.sel=el.getAttribute('data-id'); gravar(); lista(); detalhe(); };
 });
}

function blocoTexto(idCampo,rotulo,dica){
 var a=atual();
 return '<label>'+rotulo+'</label><textarea data-t="'+idCampo+'" placeholder="'+escAttr(dica||'')+'">'+limpo(a[idCampo])+'</textarea>';
}

function tabelaForma(){
 var a=atual(), h='';
 h+='<table><tr><th style="width:52px">Data</th><th>Adversário (casa)</th><th style="width:52px">GM</th><th style="width:52px">GS</th><th>Adversário (fora)</th><th style="width:44px">R</th><th class="noprint"></th></tr>';
 if(!a.forma.length) h+='<tr><td colspan="7" style="color:var(--mut)">Sem jogos. Carregue em «+ Jogo».</td></tr>';
 a.forma.forEach(function(j,i){
  var gm=j.gm===''||j.gm==null?null:Number(j.gm), gs=j.gs===''||j.gs==null?null:Number(j.gs);
  var r=''; if(gm!=null&&gs!=null&&!isNaN(gm)&&!isNaN(gs)) r = gm>gs?'V':(gm<gs?'D':'E');
  h+='<tr>'
   +'<td><input value="'+escAttr(j.data)+'" data-f="'+i+'" data-k="data"></td>'
   +'<td><input value="'+escAttr(j.casa)+'" data-f="'+i+'" data-k="casa"></td>'
   +'<td><input value="'+escAttr(j.gm)+'" data-f="'+i+'" data-k="gm" inputmode="numeric" style="width:48px"></td>'
   +'<td><input value="'+escAttr(j.gs)+'" data-f="'+i+'" data-k="gs" inputmode="numeric" style="width:48px"></td>'
   +'<td><input value="'+escAttr(j.fora)+'" data-f="'+i+'" data-k="fora"></td>'
   +'<td>'+(r?'<span class="f'+r+'">'+r+'</span>':'')+'</td>'
   +'<td class="noprint"><button class="btn sm del" type="button" data-fdel="'+i+'">×</button></td></tr>';
 });
 h+='</table><button class="btn sm noprint" type="button" id="bAddJogo" style="margin-top:6px">+ Jogo</button>';
 var seq=a.forma.map(function(j){
  var gm=Number(j.gm),gs=Number(j.gs);
  if(j.gm===''||j.gs===''||isNaN(gm)||isNaN(gs))return '';
  return gm>gs?'V':(gm<gs?'D':'E');
 }).filter(Boolean);
 if(seq.length) h+='<div style="margin-top:8px"><small style="color:var(--mut)">Forma (do mais recente para o mais antigo):</small><div class="tags" style="margin-top:4px">'
  +seq.map(function(x){return '<span class="f'+x+'">'+x+'</span>'}).join('')+'</div></div>';
 return h;
}

function tabelaOnze(){
 var a=atual(), h='';
 var nums=a.onze.map(function(p){return p.n==null?'':String(p.n).trim()}).filter(Boolean);
 var rep=[]; nums.forEach(function(n,i){ if(nums.indexOf(n)!==i && rep.indexOf(n)<0) rep.push(n); });
 h+='<table><tr><th style="width:56px">Nº</th><th>Nome</th><th style="width:110px">Posição</th><th class="noprint"></th></tr>';
 if(!a.onze.length) h+='<tr><td colspan="4" style="color:var(--mut)">Sem jogadores. Carregue em «+ Jogador» (máx. 11).</td></tr>';
 a.onze.forEach(function(p,i){
  var dup = p.n && rep.indexOf(String(p.n).trim())>=0;
  h+='<tr>'
   +'<td><input value="'+escAttr(p.n)+'" data-o="'+i+'" data-k="n" inputmode="numeric" style="width:52px;'+(dup?'border-color:#e23b3b':'')+'"></td>'
   +'<td><input value="'+escAttr(p.nome)+'" data-o="'+i+'" data-k="nome"></td>'
   +'<td><input value="'+escAttr(p.pos)+'" data-o="'+i+'" data-k="pos"></td>'
   +'<td class="noprint"><button class="btn sm del" type="button" data-odel="'+i+'">×</button></td></tr>';
 });
 h+='</table>';
 if(rep.length) h+='<div class="aviso">⚠ Números repetidos no 11 inicial: '+limpo(rep.join(', '))+' — confirme no site oficial.</div>';
 if(!a.onze.length) h+='<div class="hint">Se um dia me der o endereço da ficha de jogo da FPF, esta grelha pode vir preenchida automaticamente.</div>';
 return h;
}

function quadro(j,jogada,campoId){
 var t=limpo(jogada.tipo);
 return '<div class="jogada" data-j="'+jogada.id+'">'
 +'<div class="cab"><select data-jtipo="'+jogada.id+'" style="max-width:260px">'
 +OPCOES_TIPO.map(function(o){return '<option'+(o===jogada.tipo?' selected':'')+'>'+o+'</option>'}).join('')
 +'</select><span class="sp2"></span><button class="btn sm del noprint" type="button" data-jdel="'+jogada.id+'">Apagar</button></div>'
 +'<label>Nome / código da jogada</label><input data-jnome="'+jogada.id+'" value="'+escAttr(jogada.nome)+'" placeholder="Ex.: Canto direito — 1º poste">'
 +'<div class="row noprint" style="margin:9px 0">'
 +'<button class="btn sm" type="button" data-tool="move" data-alvo="'+jogada.id+'" class="on">✋ Mover</button>'
 +'<button class="btn sm" type="button" data-tool="A" data-alvo="'+jogada.id+'">🔴 Nós</button>'
 +'<button class="btn sm" type="button" data-tool="B" data-alvo="'+jogada.id+'">🔵 Adversário</button>'
 +'<button class="btn sm" type="button" data-tool="ball" data-alvo="'+jogada.id+'">⚽ Bola</button>'
 +'<button class="btn sm" type="button" data-tool="arr" data-alvo="'+jogada.id+'">➡ Corrida</button>'
 +'<button class="btn sm" type="button" data-tool="pass" data-alvo="'+jogada.id+'">⇢ Passe</button>'
 +'<button class="btn sm" type="button" data-tool="cone" data-alvo="'+jogada.id+'">🔺 Cone</button>'
 +'<button class="btn sm" type="button" data-tool="del" data-alvo="'+jogada.id+'">🗑 Apagar</button>'
 +'<button class="btn sm" type="button" data-limpar="'+jogada.id+'">Limpar</button>'
 +'</div>'
 +'<div class="palco" id="'+campoId+'"><div class="zona">'+desenhar(jogada)+'</div></div>'
 +'<div class="hint noprint">Meio-campo vertical (baliza em cima). Toque onde quer colocar o elemento; arraste os pins para os mover; com «Corrida» ou «Passe», arraste para desenhar a seta.</div>'
 +'<label>Descrição / movimentos</label><textarea data-jdesc="'+jogada.id+'" placeholder="1º movimento, bloqueio, zona de ataque, quem fica fora...">'+limpo(jogada.descricao)+'</textarea>'
 +'</div>';
}

function detalhe(){
 var a=atual();
 if(!a){ document.getElementById('det').innerHTML='<div class="card empty">Escolha ou crie um adversário à esquerda.</div>'; return; }
 var h='';
 h+='<div class="card">'
 +'<div class="row"><h2 style="margin:0">'+(limpo(a.nome)||'Novo adversário')+'</h2><span class="sp2"></span>'
 +'<button class="btn sm del noprint" type="button" id="bApagar">Apagar relatório</button></div>'
 +'<div class="g3" style="margin-top:8px">'
 +'<div><label>Adversário</label><input data-a="nome" value="'+escAttr(a.nome)+'" placeholder="Nome do clube"></div>'
 +'<div><label>Competição / jornada</label><input data-a="comp" value="'+escAttr(a.comp)+'" placeholder="Ex.: Distrital 1.ª Div. — J7"></div>'
 +'<div><label>Data do jogo</label><input type="date" data-a="data" value="'+escAttr(a.data)+'"></div>'
 +'</div>'
 +'<div class="g3">'
 +'<div><label>A nossa equipa</label><input data-a="equipa" value="'+escAttr(a.equipa)+'" placeholder="Ex.: Juventude FC"></div>'
 +'<div><label>Campo / local</label><input data-a="campo" value="'+escAttr(a.campo)+'" placeholder="Casa / Fora / nome do campo"></div>'
 +'<div><label>Casa ou fora</label><input data-a="casaFora" value="'+escAttr(a.casaFora)+'" placeholder="Casa / Fora / Neutro"></div>'
 +'</div>'
 +'<div class="g2">'
 +'<div><label>Sistema de jogo preferencial</label><input data-a="sistema" value="'+escAttr(a.sistema)+'" placeholder="Ex.: 4-4-2"></div>'
 +'<div><label>Variações / nota do sistema</label><input data-a="sistemaNota" value="'+escAttr(a.sistemaNota)+'" placeholder="Ex.: passa a 4-3-3 sem bola"></div>'
 +'</div>'
 +'</div>';

 h+='<div class="card"><h3>Últimos 5 jogos</h3><div class="hint" style="margin-bottom:8px">Preencha os golos marcados (GM) e sofridos (GS) e a forma calcula-se sozinha. Se um dia me der o endereço do zerozero, isto pode vir preenchido automaticamente.</div>'
 +tabelaForma()+'</div>';

 h+='<div class="card"><h3>11 inicial — último jogo</h3><div class="hint" style="margin-bottom:8px">Número e nome, como na ficha de jogo.</div>'
 +tabelaOnze()+'</div>';

var estadoFerramenta={};

/* =====================================================================
   QUADRO TATICO — corrigido.
   O defeito anterior: os ouvintes estavam colados ao elemento <svg>, e o
   <svg> e substituido a cada alteracao; o elemento novo ficava sem
   ouvintes e nada respondia. Agora:
   - os ouvintes ficam no "palco" (a caixa), que nunca e substituida;
   - trato tudo por captura, com pointerdown/move/up;
   - o desenho durante o arrasto faz-se trocando so o conteudo interno.
   ===================================================================== */
var arrastoAtivo=null;   /* {palco, jogada, tipo, indice, ar, mudou, jogId} */

function areaTrabalho(palco){ return palco.querySelector('.zona'); }

function pintar(palco, tmp){
 var zona=areaTrabalho(palco);
 if(!zona)return;
 var jog=arrastoAtivo&&arrastoAtivo.palco===palco?arrastoAtivo.jogada:null;
 var alvo=tmp||jog;
 if(!alvo)return;
 zona.innerHTML=desenhar(alvo);
}

function ligarQuadro(palco,jogada){
 if(palco.getAttribute('data-ligado')==='1')return;
 palco.setAttribute('data-ligado','1');

 function fer(){ return estadoFerramenta[jogada.id]||'move'; }
 function pos(e){
  var zona=areaTrabalho(palco);
  return pontos(e, zona||palco);
 }
 function achar(e,atributo){
  var t=e.target, n=t&&t.closest?t.closest('['+atributo+']'):null;
  return n?+n.getAttribute(atributo):null;
 }

 palco.addEventListener('pointerdown',function(e){
  var f=fer();
  var zona=areaTrabalho(palco);
  if(!zona)return;
  var idx=achar(e,'data-k'), ia=achar(e,'data-a');

  if(f==='del'){
   e.preventDefault(); e.stopPropagation();
   if(idx!==null) jogada.q.tok.splice(idx,1);
   else if(ia!==null) jogada.q.arr.splice(ia,1);
   else return;
   gravar(); pintar(palco,jogada); return;
  }
  if(f==='move'){
   if(idx===null)return;
   e.preventDefault(); e.stopPropagation();
   arrastoAtivo={palco:palco,jogada:jogada,tipo:'pin',indice:idx,ar:null,mudou:false};
   try{ palco.setPointerCapture(e.pointerId); }catch(err){}
   return;
  }
  if(f==='A'||f==='B'){
   e.preventDefault(); e.stopPropagation();
   var sugestao=String(jogada.q.tok.filter(function(t){return t.t===f;}).length+1);
   var n=prompt('Numero ou letra do jogador:',sugestao);
   if(n===null||n==='')return;
   var p1=pos(e);
   jogada.q.tok.push({t:f,x:p1.x,y:p1.y,n:n});
   gravar(); pintar(palco,jogada); return;
  }
  if(f==='ball'||f==='cone'){
   e.preventDefault(); e.stopPropagation();
   var p2=pos(e);
   if(f==='ball') jogada.q.tok=jogada.q.tok.filter(function(t){return t.t!=='ball';});
   jogada.q.tok.push({t:f,x:p2.x,y:p2.y});
   gravar(); pintar(palco,jogada); return;
  }
  if(f==='arr'||f==='pass'){
   e.preventDefault(); e.stopPropagation();
   var p3=pos(e);
   arrastoAtivo={palco:palco,jogada:jogada,tipo:'seta',indice:null,
     ar:{t:f,x1:p3.x,y1:p3.y,x2:p3.x,y2:p3.y},mudou:false};
   try{ palco.setPointerCapture(e.pointerId); }catch(err){}
  }
 },false);

 palco.addEventListener('pointermove',function(e){
  var A=arrastoAtivo;
  if(!A||A.palco!==palco)return;
  e.preventDefault();
  var pt=pos(e);
  if(A.tipo==='pin'){
   var t=jogada.q.tok[A.indice];
   if(!t)return;
   var mov=Math.abs(t.x-pt.x)+Math.abs(t.y-pt.y);
   if(!mov)return;
   t.x=pt.x; t.y=pt.y; A.mudou=true;
   pintar(palco,jogada);
  } else {
   A.ar.x2=pt.x; A.ar.y2=pt.y;
   if(Math.abs(A.ar.x2-A.ar.x1)+Math.abs(A.ar.y2-A.ar.y1))A.mudou=true;
   pintar(palco,{q:{tok:jogada.q.tok,arr:jogada.q.arr.concat([A.ar])}});
  }
 },false);

 function soltar(e){
  var A=arrastoAtivo;
  if(!A||A.palco!==palco)return;
  if(A.tipo==='seta'&&A.ar){
   var d=Math.sqrt(Math.pow(A.ar.x2-A.ar.x1,2)+Math.pow(A.ar.y2-A.ar.y1,2));
   if(d>=12) jogada.q.arr.push(A.ar);
  }
  arrastoAtivo=null;
  gravar();
  pintar(palco,jogada);
 }
 palco.addEventListener('pointerup',soltar,false);
 palco.addEventListener('pointercancel',soltar,false);
}
